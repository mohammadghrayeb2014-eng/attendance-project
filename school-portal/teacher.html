<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal | School Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/auth.js"></script>
  <script defer src="js/teacher.js"></script>
</head>

<body class="dashboard-layout">
  <div class="bg-blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-shield" style="width: 2.5rem; height: 2.5rem; font-size: 1.25rem; border-radius: 0.75rem;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="gradient-text">Teacher</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-link active" id="navMyClasses"><i class="fa-solid fa-chalkboard"></i> Resources</a>
      <a href="#" class="nav-link" id="navLiveSession"><i class="fa-solid fa-tower-broadcast"></i> Live Feed</a>
      <a href="#" class="nav-link" id="navAttendance"><i class="fa-solid fa-clipboard-user"></i> Logs</a>
      <div style="margin-top: auto;">
        <a href="#" id="logoutBtn" class="nav-link" style="color: #ef4444;"><i class="fa-solid fa-power-off"></i>
          Exit</a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <div>

        <p class="text-muted" id="who">Teacher authentication active...</p>
      </div>
      <div class="avatar" style="background: var(--p-600); width: 2.75rem; height: 2.75rem;">T</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div class="stat-info">
          <span class="stat-label">Active Modules</span>
          <span class="stat-value" id="statMyClasses">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="stat-info">
          <span class="stat-label">Avg Participation</span>
          <span class="stat-value" id="statMyAttendance">0%</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
        <div class="stat-info">
          <span class="stat-label">Evaluations</span>
          <span class="stat-value" id="statMyGraded">0</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 2rem;">
      <!-- Left: Resource List -->
      <div class="card" id="panelClasses">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <h3><i class="fa-solid fa-layer-group gradient-text"></i> Academic Modules</h3>
          <div class="input-wrapper" style="width: 280px;">
            <i class="fa-solid fa-magnifying-glass input-icon"></i>
            <input id="searchInput" class="input-field" placeholder="Filter classes...">
          </div>
        </div>
        <div id="list" class="stagger-in"></div>
        <div id="emptyMsg" class="text-center text-muted" style="padding: 3rem; display: none;">No modules assigned.
        </div>
      </div>

      <!-- Right: Context & Tools -->
      <div style="display: flex; flex-direction: column; gap: 2rem;">
        <div class="card">
          <h3><i class="fa-solid fa-crosshairs gradient-text"></i> Live Session</h3>
          <div id="selectedBox" style="padding: 1.5rem 0; color: var(--text-muted); font-weight: 500;">
            Select a module to initialize a live session.
          </div>
          <button id="openBtn" class="btn-premium w-full" disabled>Initialize Session</button>
          <div id="status" class="error-toast" style="color: #10b981;"></div>
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3><i class="fa-solid fa-screwdriver-wrench gradient-text"></i> Toolset</h3>
            <div style="display: flex; gap: 0.5rem;">
              <button id="tabExam" class="nav-link active"
                style="padding: 0.5rem 0.75rem; margin: 0; font-size: 0.8rem;">Exams</button>
              <button id="tabHomework" class="nav-link"
                style="padding: 0.5rem 0.75rem; margin: 0; font-size: 0.8rem;">Homework</button>
            </div>
          </div>

          <div id="examContainer">
            <div class="input-group">
              <label>Agenda</label>
              <input id="examTitle" class="input-field" placeholder="e.g. Unit 4 Test">
            </div>
            <div class="input-group" style="margin-bottom: 2rem;">
              <label>System Date</label>
              <input id="examDate" type="date" class="input-field">
            </div>
            <button id="createExamBtn" class="btn-premium w-full">Deploy Assessment</button>
          </div>

          <div id="homeworkContainer" style="display: none;">
            <div class="input-group">
              <label>Assignment</label>
              <input id="hwTitle" class="input-field" placeholder="e.g. Lab Report 2">
            </div>
            <div class="input-group">
              <label>Deadline</label>
              <input id="hwDueDate" type="date" class="input-field">
            </div>
            <button id="createHwBtn" class="btn-premium w-full">Publish Assignment</button>
          </div>

          <div id="academicMsg" class="error-toast" style="color: #10b981; margin-top: 1rem;"></div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
