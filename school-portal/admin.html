<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - School Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/auth.js"></script>
  <script defer src="js/admin.js"></script>
</head>

<body class="dashboard-layout">
  <div class="mobile-topbar">
    <div class="sidebar-logo" style="margin-bottom: 0;">
      <div class="logo-shield" style="width: 2rem; height: 2rem; font-size: 1rem; border-radius: 0.5rem;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="gradient-text">Admin</span>
    </div>
    <button class="hamburger" id="hamburgerBtn">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="bg-blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-shield" style="width: 2.5rem; height: 2.5rem; font-size: 1.25rem; border-radius: 0.75rem;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="gradient-text">Portal</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-link active" id="navDashboard"><i class="fa-solid fa-gauge-high"></i> Overview</a>
      <a href="#" class="nav-link" id="navTeachers"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
      <a href="#" class="nav-link" id="navStudents"><i class="fa-solid fa-user-graduate"></i> Students</a>
      <a href="#" class="nav-link" id="navClasses"><i class="fa-solid fa-users-rectangle"></i> Classes</a>
      <a href="#" class="nav-link" id="navSubjects"><i class="fa-solid fa-book-open"></i> Subjects</a>
      <a href="#" class="nav-link" id="navAssignments"><i class="fa-solid fa-calendar-check"></i> Assignments</a>
      <div style="margin-top: auto;">
        <a href="#" id="logoutBtn" class="nav-link" style="color: #ef4444;"><i class="fa-solid fa-power-off"></i>
          Exit</a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <div>
        <h1 class="gradient-text" style="font-size: 2.25rem; margin-bottom: 0.5rem;">Admin Dashboard</h1>
        <p class="text-muted" id="who">Logged in as: ...</p>
      </div>
      <div class="user-profile" style="display: flex; align-items: center; gap: 1rem;">
        <div class="avatar" style="background: var(--p-600); width: 2.75rem; height: 2.75rem;">AD</div>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Teachers</span>
        <span class="stat-value" id="statTeachers">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Students</span>
        <span class="stat-value" id="statStudents">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Classes</span>
        <span class="stat-value" id="statClasses">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Avg Attendance</span>
        <span class="stat-value" id="statAttendance">0%</span>
      </div>
    </div>


    <!-- Interface Content Grid -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
      <!-- Teachers Section -->
      <div class="card" id="cardTeachers">
        <h3><i class="fa-solid fa-user-plus gradient-text"></i> Register Teacher</h3>
        <div class="input-group">
          <label>Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input id="newTeacherUsername" class="input-field" placeholder="">
          </div>
        </div>
        <div class="input-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-signature input-icon"></i>
            <input id="newTeacherName" class="input-field" placeholder="">
          </div>
        </div>
        <button id="createTeacherBtn" class="btn-premium w-full">Create Account</button>
        <div id="teacherCreatedMsg" class="error-toast" style="color: #10b981;"></div>
      </div>

      <!-- Students Section -->
      <div class="card" id="cardStudents">
        <h3><i class="fa-solid fa-user-graduate gradient-text"></i> Register Student</h3>
        <div class="input-group">
          <label>Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card input-icon"></i>
            <input id="newStudentUsername" class="input-field" placeholder="">
          </div>
        </div>
        <div class="input-group">
          <label>Legal Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-signature input-icon"></i>
            <input id="newStudentName" class="input-field" placeholder="">
          </div>
        </div>
        <button id="createStudentBtn" class="btn-premium w-full">Enroll Student</button>
        <div id="studentCreatedMsg" class="error-toast" style="color: #10b981;"></div>
      </div>

      <!-- Class Management -->
      <div class="card" id="cardClasses">
        <h3><i class="fa-solid fa-users-rectangle gradient-text"></i> Create Class</h3>
        <div class="input-group">
          <label>Class Name</label>
          <input id="className" class="input-field" placeholder="">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="input-group">
            <label>Row Capacity</label>
            <input id="classRows" type="number" class="input-field" placeholder="Rows">
          </div>
          <div class="input-group">
            <label>Column Capacity</label>
            <input id="classCols" type="number" class="input-field" placeholder="Cols">
          </div>
        </div>
        <button id="addClassBtn" class="btn-premium w-full">Create Classroom</button>
      </div>

      <!-- Subjects & Assigning -->
      <div class="card" id="cardSubjects">
        <h3><i class="fa-solid fa-book-open gradient-text"></i> Subjects</h3>
        <div class="input-group">
          <label>Subject Name</label>
          <input id="subjectName" class="input-field" placeholder="">
        </div>
        <button id="addSubjectBtn" class="btn-premium w-full">Add Subject</button>
      </div>

      <div class="card" id="cardAssignments" style="grid-column: span 2;">
        <h3><i class="fa-solid fa-link gradient-text"></i> Assign Teacher to Class</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
          <div class="input-group">
            <label>Instructor</label>
            <select id="teacherSelect" class="input-field"></select>
          </div>
          <div class="input-group">
            <label>Classroom</label>
            <select id="classSelect" class="input-field"></select>
          </div>
          <div class="input-group">
            <label>Course</label>
            <select id="subjectSelect" class="input-field"></select>
          </div>
        </div>
        <button id="assignBtn" class="btn-premium w-full">Save Assignment</button>
        <div id="adminMsg" class="error-toast"></div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      protectPage("admin");
      const user = getCurrentUser();
      if (user) document.getElementById("who").textContent = "Welcome, " + user.username;
      document.getElementById("logoutBtn").addEventListener("click", (e) => { e.preventDefault(); logout(); });

      // Mobile Menu Logic
      const hamberBtn = document.getElementById("hamburgerBtn");
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      const toggleMenu = () => {
        hamberBtn.classList.toggle("active");
        sidebar.classList.toggle("open");
        overlay.classList.toggle("open");
      };

      hamberBtn.addEventListener("click", toggleMenu);
      overlay.addEventListener("click", toggleMenu);
      // Close on link click on mobile
      document.querySelectorAll(".nav-link").forEach(link => {
        link.addEventListener("click", () => {
          if (sidebar.classList.contains("open")) toggleMenu();
        });
      });
    });
  </script>
</body>

</html>
