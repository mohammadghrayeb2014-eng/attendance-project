<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Session - School Portal</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-layout">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar">
      <div class="sidebar-logo" style="margin-bottom: 0;">
          <i class="fa-solid fa-graduation-cap"></i>
          <span class="logo-text">Portal</span>
      </div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
      </button>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fa-solid fa-graduation-cap"></i>
      <span class="logo-text">Portal</span>
    </div>

    <nav class="nav-links">
      <a href="/teacher" class="nav-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
      <div style="margin: 1.5rem 0; border-top: 2px solid var(--slate-100);"></div>
      <a href="#" class="nav-link active">
        <i class="fa-solid fa-video"></i> Live Session
      </a>
      <a href="#" class="nav-link">
        <i class="fa-solid fa-users"></i> Student List
      </a>
    </nav>
  </aside>

  <main class="main-content stagger-in">
    <header class="header">
      <div>
        <h1 id="sessionTitle" style="font-size: 2rem;">Live Attendance <span class="gradient-text">Tracker</span></h1>
        <p id="sessionSubtitle" style="color: var(--slate-400); font-weight: 500;">Initializing session...</p>
      </div>
      <div class="header-actions">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span id="status" class="status status-pending">Ready</span>
          <button id="runBtn" class="btn btn-primary">
            <i class="fa-solid fa-play"></i> Run Attendance
          </button>
        </div>
      </div>
    </header>

    <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 2rem;" class="session-grid">
      <!-- Left: Table & Grid -->
      <div class="flex-col gap-4">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h3>Attendance Results</h3>
            <button class="btn btn-outline btn-sm">Export CSV</button>
          </div>
          <div id="tableBox" class="table-container">
            <div style="padding: 3rem; text-align: center; color: var(--slate-400);">
              No data captured yet.
            </div>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 2rem;">Debug Frames</h3>
          <div id="frames" class="frames" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
            <div style="grid-column: 1/-1; padding: 2rem; text-align: center; color: var(--slate-400);">
              Visual verification will appear here.
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Session Info -->
      <div class="flex-col gap-4">
        <div class="card">
          <h3 style="margin-bottom: 1.5rem;">Class Info</h3>
          <div id="classInfoBox">
            <!-- Injected via JS -->
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 1.5rem;">Quick Actions</h3>
          <div class="flex-col gap-4">
            <button class="btn btn-outline w-full"><i class="fa-solid fa-camera"></i> Manual Capture</button>
            <button class="btn btn-outline w-full"><i class="fa-solid fa-rotate"></i> Reset Session</button>
            <button class="btn btn-primary w-full" style="background: var(--success); border: none;">
              <i class="fa-solid fa-check-double"></i> Finalize Results
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    // UI Interaction
    const hamberBtn = document.getElementById("hamburgerBtn");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    const toggleMenu = () => {
        hamberBtn.classList.toggle("active");
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
        document.body.style.overflow = sidebar.classList.contains("active") ? "hidden" : "";
    };

    if (hamberBtn) hamberBtn.addEventListener("click", toggleMenu);
    if (overlay) overlay.addEventListener("click", toggleMenu);

    // Specific logic for session page
    const ACTIVE_KEY = "active_assignment";
    window.addEventListener('load', () => {
      const raw = localStorage.getItem(ACTIVE_KEY);
      if (raw) {
        const sub = JSON.parse(raw);
        document.getElementById('sessionSubtitle').textContent = `${sub.class_name} • ${sub.subject_name}`;
        document.getElementById('classInfoBox').innerHTML = `
            <div class="flex-col gap-4">
                <div class="flex-col">
                    <span style="font-size: 0.85rem; color: var(--slate-400); font-weight: 700; text-transform: uppercase;">Class ID</span>
                    <span style="font-weight: 800; font-size: 1.1rem; color: var(--primary);">${sub.class_id}</span>
                </div>
                <div class="flex-col">
                    <span style="font-size: 0.85rem; color: var(--slate-400); font-weight: 700; text-transform: uppercase;">Subject</span>
                    <span style="font-weight: 800; font-size: 1.1rem;">${sub.subject_name}</span>
                </div>
                <div class="flex-col">
                    <span style="font-size: 0.85rem; color: var(--slate-400); font-weight: 700; text-transform: uppercase;">Seating Configuration</span>
                    <span style="font-weight: 800; font-size: 1.1rem;">${sub.rows} Rows x ${sub.cols} Cols</span>
                </div>
            </div>
        `;
      }
    });
  </script>
</body>

</html>
