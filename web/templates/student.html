<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - School Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-layout">
    <!-- Mobile Topbar -->
    <div class="mobile-topbar">
        <div class="sidebar-logo" style="margin-bottom: 0;">
            <i class="fa-solid fa-graduation-cap"></i>
            <span class="logo-text">Portal</span>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span class="logo-text">Portal</span>
        </div>

        <nav class="nav-links">
            <a href="#" class="nav-link active">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-user-graduate"></i> My Grades
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>

            <div style="margin-top: auto;">
                <a href="#" id="logoutBtn" class="nav-link" style="color: var(--danger);">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </div>
        </nav>
    </aside>

    <main class="main-content stagger-in">
        <header class="header">
            <div>
                <h1>Hello, <span class="gradient-text" id="studentName">Student</span></h1>
                <p id="todayDate" style="color: var(--slate-400); font-weight: 500;"></p>
            </div>
            <div class="header-actions">
                <div class="user-profile">
                    <button class="btn btn-outline" style="border-radius: 50%; width: 3rem; height: 3rem; padding: 0;">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="avatar" id="studentAvatar">S</div>
                </div>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="card stat-card">
                <div class="stat-icon"><i class="fa-solid fa-award"></i></div>
                <span class="stat-label">My GPA</span>
                <span class="stat-value">3.8</span>
            </div>
            <div class="card stat-card">
                <div class="stat-icon" style="color: var(--success); background: #ecfdf5;"><i class="fa-solid fa-calendar-days"></i></div>
                <span class="stat-label">My Attendance</span>
                <span class="stat-value">95%</span>
            </div>
            <div class="card stat-card">
                <div class="stat-icon" style="color: var(--warning); background: #fffbeb;"><i class="fa-solid fa-clock"></i></div>
                <span class="stat-label">Homework to do</span>
                <span class="stat-value">2</span>
            </div>
        </div>

        <div class="card" style="padding: 4rem; text-align: center;">
            <div style="font-size: 5rem; margin-bottom: 2rem;">🚀</div>
            <h2 style="margin-bottom: 1rem;">Your Academic Journey</h2>
            <p style="color: var(--slate-400); max-width: 500px; margin: 0 auto 3rem; font-size: 1.1rem; font-weight: 500;">
                We're currently preparing your detailed performance analytics and semester insights. Check back soon for deeper data!
            </p>
            <button class="btn btn-primary">Refresh Dashboard</button>
        </div>
    </main>

    <script>
        const STORAGE_KEY = "user";
        
        // Mobile Navigation
        const hamberBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        const toggleMenu = () => {
            hamberBtn.classList.toggle("active");
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
            document.body.style.overflow = sidebar.classList.contains("active") ? "hidden" : "";
        };

        if (hamberBtn) hamberBtn.addEventListener("click", toggleMenu);
        if (overlay) overlay.addEventListener("click", toggleMenu);

        window.addEventListener('load', () => {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const user = JSON.parse(raw);
                document.getElementById('studentName').textContent = user.name;
                document.getElementById('studentAvatar').textContent = user.name[0];
            }
            document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem(STORAGE_KEY);
                window.location.href = "/login";
            });
        });
    </script>
</body>

</html>
