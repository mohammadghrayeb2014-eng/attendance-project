<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - School Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap gradient-text"></i>
            <span class="gradient-text">Portal</span>
        </div>

        <nav class="nav-links">
            <a href="#" class="nav-link active">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-user-graduate"></i> My Grades
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>

            <div style="margin-top: auto;">
                <a href="#" id="logoutBtn" class="nav-link" style="color: #ef4444;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <h2>Hello, <span class="gradient-text" id="studentName">Student</span></h2>
                <p id="todayDate" style="color: var(--text-secondary);"></p>
            </div>
            <div class="user-profile">
                <button class="btn btn-outline" style="border-radius: 50%; width: 2.5rem; height: 2.5rem; padding: 0;">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <div class="avatar" id="studentAvatar">S</div>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="card stat-card">
                <span class="stat-label">Overall GPA</span>
                <span class="stat-value">3.8</span>
                <span class="status status-active">Top 10%</span>
            </div>
            <div class="card stat-card">
                <span class="stat-label">Attendance</span>
                <span class="stat-value">95%</span>
                <span class="status status-active">Great</span>
            </div>
            <div class="card stat-card">
                <span class="stat-label">Pending HW</span>
                <span class="stat-value">2</span>
                <span class="status status-pending">Due Soon</span>
            </div>
        </div>

        <div class="card" style="padding: 4rem; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">🚀</div>
            <h3>Your Academic Journey</h3>
            <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 2rem;">We're currently preparing
                your detailed performance analytics. Check back soon for deeper insights!</p>
            <button class="btn btn-primary">Refresh Dashboard</button>
        </div>
    </main>

    <script>
        const STORAGE_KEY = "user";
        window.addEventListener('load', () => {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const user = JSON.parse(raw);
                document.getElementById('studentName').textContent = user.name;
                document.getElementById('studentAvatar').textContent = user.name[0];
            }
            document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                window.location.href = "/login";
            });
        });
    </script>
</body>

</html>
