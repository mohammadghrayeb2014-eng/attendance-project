<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">
    <div class="stagger-in">
        <div class="login-card glass">
            <div style="text-align: center; margin-bottom: 3rem;">
                <div class="avatar" style="width: 4.5rem; height: 4.5rem; margin: 0 auto 1.5rem; font-size: 2rem;">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="gradient-text" style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800;">Portal</h1>
                <p style="color: var(--slate-400); font-weight: 500;">Enter your credentials to continue</p>
            </div>

            <div class="role-selector">
                <button type="button" class="role-btn active" onclick="selectRole('student', this)">
                    Student
                </button>
                <button type="button" class="role-btn" onclick="selectRole('teacher', this)">
                    Teacher
                </button>
                <button type="button" class="role-btn" onclick="selectRole('admin', this)">
                    Admin
                </button>
            </div>
            
            <input type="hidden" id="roleInput" value="student">

            <form id="loginForm" onsubmit="handleLogin(event)" class="flex-col gap-4">
                <div class="flex-col gap-2">
                    <label style="font-weight: 700; color: var(--slate-700); font-size: 0.9rem;">Username</label>
                    <input type="text" id="username" class="input-field" placeholder="e.g. johndoe" required>
                </div>

                <div class="flex-col gap-2">
                    <label style="font-weight: 700; color: var(--slate-700); font-size: 0.9rem;">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin: 0.5rem 0 1.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; color: var(--slate-400); cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 700;">Forgot?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-full">
                    Sign In <i class="fa-solid fa-arrow-right-long" style="margin-left: 0.5rem;"></i>
                </button>
            </form>

            <div id="loginMsg" style="margin-top: 1.5rem; font-weight: 600; text-align: center; min-height: 1.5rem;"></div>
        </div>
    </div>

    <script>
        // API Base - assuming school-portal/backend/app.py is running on port 8000
        const API_BASE = "http://127.0.0.1:5001/api";
        const STORAGE_KEY = "user";

        function selectRole(role, btn) {
            document.getElementById('roleInput').value = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('roleInput').value;
            const msgEl = document.getElementById('loginMsg');
            const btn = document.getElementById('submitBtn');

            msgEl.textContent = "";
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    throw new Error(data.error || "Invalid credentials");
                }

                // Verify role match (optional security layer)
                if (data.role !== role && data.role !== 'admin') {
                    // If they selected teacher but are student, or vice versa
                    // But usually the backend defines the role. Let's just follow backend role.
                }

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                msgEl.style.color = "var(--success)";
                msgEl.textContent = "Welcome back! Redirecting...";

                setTimeout(() => {
                    const r = data.role;
                    if (r === "admin") window.location.href = "/admin";
                    else if (r === "teacher") window.location.href = "/teacher";
                    else window.location.href = "/student";
                }, 1000);

            } catch (err) {
                msgEl.style.color = "var(--danger)";
                msgEl.textContent = err.message;
                btn.disabled = false;
                btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-long" style="margin-left: 0.5rem;"></i>';
            }
        }

        // Initialize from last used role or default
        window.addEventListener('load', () => {
            // Optional: load from localStorage
        });
    </script>
</body>

</html>
