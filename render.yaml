services:
  - type: web
    name: attendance-portal-v2
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --chdir school-portal/backend --timeout ${GUNICORN_TIMEOUT:-900} app:app"
    envVars:
      - key: MONGO_DB_NAME
        value: attendance_db
      - key: FLASK_DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false
      - key: PHONE_DETECTION_MODEL
        value: models/phone_yolo11.pt
      - key: PHONE_DETECTION_FALLBACK_MODEL
        value: models/yolo11s.pt
      - key: PHONE_DETECTION_MAX_FRAMES
        value: "60"
      - key: PHONE_DETECTION_CONFIDENCE
        value: "0.10"
      - key: PHONE_DETECTION_FALLBACK_CONFIDENCE
        value: "0.35"
      - key: PHONE_DETECTION_STRONG_CONFIDENCE
        value: "0.75"
      - key: PHONE_DETECTION_MIN_SUPPORT_FRAMES
        value: "2"
      - key: PHONE_DETECTION_FALLBACK_USE_TILES
        value: "0"
      - key: PHONE_DETECTION_SEAT_ROWS
        value: "4"
      - key: PHONE_DETECTION_SEAT_COLS
        value: "6"
      - key: PHONE_DETECTION_IMGSZ
        value: "768"
      - key: PHONE_DETECTION_USE_TILES
        value: "1"
      - key: PHONE_DETECTION_TILE_GRID
        value: 3x3
      - key: SLEEP_DETECTION_MODEL
        value: models/sleep_yolo11.pt
      - key: SLEEP_DETECTION_MAX_FRAMES
        value: "20"
      - key: SLEEP_DETECTION_CONFIDENCE
        value: "0.35"
      - key: SLEEP_DETECTION_STRONG_CONFIDENCE
        value: "0.90"
      - key: SLEEP_DETECTION_MIN_SUPPORT_FRAMES
        value: "5"
      - key: SLEEP_DETECTION_SEAT_ROWS
        value: "4"
      - key: SLEEP_DETECTION_SEAT_COLS
        value: "6"
      - key: SLEEP_DETECTION_IMGSZ
        value: "768"
      - key: SLEEP_DETECTION_USE_TILES
        value: "0"
      - key: SLEEP_DETECTION_TILE_GRID
        value: 3x3
      - key: SLEEP_DETECTION_CLASSES
        value: sleep,sleeping,sleeper,asleep,nap,napping,head down,heads down,lying down,laying down,prone,supine,to-left,to-right,to left,to right
      - key: AI_SEAT_VERIFY
        value: "1"
      - key: AI_SEAT_VERIFY_MIN_HITS
        value: "2"
      - key: AI_SEAT_VERIFY_CANDIDATE_MAX_DISTANCE
        value: "0.62"
      - key: HAND_RAISE_MODEL
        value: models/yolo11n-pose.pt
      - key: HAND_RAISE_MAX_FRAMES
        value: "50"
      - key: HAND_RAISE_CONFIDENCE
        value: "0.25"
      - key: HAND_RAISE_IMGSZ
        value: "640"
      - key: HAND_RAISE_FINAL_WINDOW_RATIO
        value: "0.45"
      - key: HAND_RAISE_MIN_FINAL_FRAMES
        value: "2"
      - key: HAND_RAISE_WRIST_MARGIN
        value: "0.04"
      - key: TEACHER_PRESENCE_MODEL
        value: models/yolo11s.pt
      - key: TEACHER_PRESENCE_MAX_FRAMES
        value: "20"
      - key: TEACHER_PRESENCE_CONFIDENCE
        value: "0.35"
      - key: TEACHER_PRESENCE_MIN_FRAMES
        value: "8"
      - key: TEACHER_PRESENCE_MIN_FRAME_RATIO
        value: "0.45"
      - key: TEACHER_PRESENCE_FACE_PERSON_MIN_FRAMES
        value: "5"
      - key: TEACHER_PRESENCE_FACE_PERSON_MIN_RATIO
        value: "0.25"
      - key: TEACHER_PRESENCE_IMGSZ
        value: "768"
      - key: TEACHER_PRESENCE_BOARD_ZONE
        value: "0.05,0.00,0.95,0.70"
      - key: TEACHER_PRESENCE_MIN_PERSON_HEIGHT
        value: "0.25"
      - key: TEACHER_PRESENCE_MIN_PERSON_WIDTH
        value: "0.06"
      - key: TEACHER_PRESENCE_MIN_BOTTOM
        value: "0.45"
      - key: TEACHER_PRESENCE_MIN_ASPECT
        value: "1.15"
      - key: TEACHER_PRESENCE_REQUIRE_FACE
        value: "0"
      - key: TEACHER_PRESENCE_FACE_CONFIDENCE
        value: "0.60"
